[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
serialize_precision = -1
allow_url_fopen = On
memory_limit = 512M
error_reporting = E_ALL
display_errors = On
log_errors = On
; extension directory (absolute path to avoid relative issues)
extension_dir = "D:\\Guised Up\\backend\\laravel\\portable_php\\ext"

; Enable common extensions available in this portable build
extension=php_openssl.dll
extension=php_curl.dll
extension=php_pdo_pgsql.dll
extension=php_mbstring.dll
extension=php_zip.dll
extension=php_fileinfo.dll
extension=php_pdo_sqlite.dll
extension=php_sqlite3.dll

[Date]
date.timezone = UTC
